name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check th10_gym tests
      - name: Python tests
        run: python -m pytest -q
      - name: Native tests
        shell: pwsh
        run: ./native/scripts/test_native.ps1
